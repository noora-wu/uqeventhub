<div id="{{ target_id }}">
  <div class="alert alert-success mb-2">Applied suggestion. Remember to click “Save changes”.</div>
</div>

<input hx-swap-oob="true" class="form-control" id="evt-lead" name="lead" type="text" value="{{ tagline|default:'' }}" />
<textarea hx-swap-oob="true" class="form-control" id="evt-about" name="about" rows="8">{{ description|default:'' }}</textarea>
<textarea hx-swap-oob="true" class="form-control" id="evt-bullets" name="bullets" rows="4">{{ bullets|default:'' }}</textarea>

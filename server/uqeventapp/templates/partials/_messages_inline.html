{% if messages %}
<div class="vstack gap-2 mb-3" role="region" aria-label="Notifications">
  {% for message in messages %}
  <div class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'warning' %}warning{% elif message.level_tag == 'success' %}success{% else %}info{% endif %} mb-0" role="alert">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
